<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching app brand -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop Shadows for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Tree Branches / State Space Edges -->
  <!-- Root -> Left (pruned branch) -->
  <line x1="256" y1="144" x2="160" y2="270" stroke="rgba(255,255,255,0.45)" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 24" />

  <!-- Root -> Right (active exploration path) -->
  <line x1="256" y1="144" x2="352" y2="270" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

  <!-- Right -> Solution Node (solved path) -->
  <line x1="352" y1="270" x2="376" y2="384" stroke="#34d399" stroke-width="20" stroke-linecap="round" />

  <!-- Backtrack Arc & Arrow (amber loop returning from dead-end to root) -->
  <path d="M 152 250 C 112 186, 168 138, 222 138" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" stroke-dasharray="16 12" />
  <polygon points="238,138 206,122 212,154" fill="#fbbf24" />

  <!-- Nodes -->
  <!-- Left Node: Pruned / Dead End (Ruby / Coral with X) -->
  <circle cx="160" cy="270" r="30" fill="#f43f5e" stroke="#ffffff" stroke-width="8" filter="url(#shadow)" />
  <line x1="148" y1="258" x2="172" y2="282" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="172" y1="258" x2="148" y2="282" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Right Node: Decision Node (Indigo ring) -->
  <circle cx="352" cy="270" r="32" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="8" filter="url(#shadow)" />
  <circle cx="352" cy="270" r="16" fill="#4f46e5" />

  <!-- Solution Node: Leaf (Emerald green with Checkmark) -->
  <circle cx="376" cy="384" r="36" fill="url(#successGrad)" stroke="#ffffff" stroke-width="8" filter="url(#glow)" />
  <path d="M 364 384 L 373 393 L 391 375" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Root Node (Top) -->
  <circle cx="256" cy="144" r="42" fill="url(#nodeGrad)" stroke="#6366f1" stroke-width="8" filter="url(#shadow)" />
  <circle cx="256" cy="144" r="22" fill="#4f46e5" />
</svg>
